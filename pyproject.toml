[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfpspack"
version = "1.0.0"
description = "Python port of FPSPACK: Focal mechanism tools for seismology"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Ali Comoglu", email = "comoglu@github.com"},
]
maintainers = [
    {name = "Ali Comoglu", email = "comoglu@github.com"},
]
keywords = [
    "seismology",
    "earthquake",
    "focal-mechanism",
    "moment-tensor",
    "beachball",
    "strike-dip-rake",
    "P-T-axes",
    "geophysics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "pyfpspack[gui,dev]",
]

[project.urls]
Homepage = "https://github.com/comoglu/pyfpspack"
Documentation = "https://github.com/comoglu/pyfpspack#readme"
Repository = "https://github.com/comoglu/pyfpspack.git"
Issues = "https://github.com/comoglu/pyfpspack/issues"

[project.scripts]
pyfpspack-gui = "pyfpspack.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pyfpspack"]
omit = ["*/gui/*"]
